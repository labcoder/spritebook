[package]
name = "spritebook-lock"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
strip = true
lto = true
