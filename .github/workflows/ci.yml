# P1-T1 CI: enforce the working agreements on every push/PR.
# Kept free & simple: standard hosted runners only. Deno pinned per the
# D-004 canary rider (upgrade deliberately; re-run the GPU test lane first).
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DENO_VERSION: '2.9.2'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: format
        run: deno fmt --check
      - name: lint
        run: deno lint
      - name: commit lint (PR range)
        if: github.event_name == 'pull_request'
        run: node tools/ci/commit-lint.mjs --range origin/${{ github.base_ref }}..HEAD
      - name: tests required (PR)
        if: github.event_name == 'pull_request'
        run: deno run --allow-run tools/ci/tests-required.ts --base origin/${{ github.base_ref }}
      - name: BOM guard (PR)
        if: github.event_name == 'pull_request'
        run: deno run --allow-run --allow-read tools/ci/bom-guard.ts --base origin/${{ github.base_ref }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: test
        run: deno task test
      - name: coverage (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: deno task coverage
      - name: upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # Software-Vulkan lane: the render suites run here (hosted runners have no GPU).
  # Mesa lavapipe gives a real-if-slow WebGPU adapter — good for the structural
  # golden suite, the double-render byte canary, and the width-100 strip. Pixels
  # are NOT compared against hardware goldens here (a separate set; would poison
  # both). DENO_WEBGPU_BACKEND is pinned so comparisons are like-for-like, and
  # SPRITEBOOK_REQUIRE_GPU turns a missing adapter into a hard failure so a broken
  # lane can't masquerade as "all render tests skipped, green".
  lavapipe:
    runs-on: ubuntu-latest
    env:
      DENO_WEBGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: lavapipe adapter smoke
        run: vulkaninfo --summary | grep -i llvmpipe
      # render structural/canary/strip + the style GPU seam (render->style e2e).
      # The style CPU pipeline + perceptual goldens are deterministic over
      # committed AOV fixtures, so they also run GPU-free on the hosted `test`
      # matrix; here they additionally exercise the live render->style seam.
      # cli included so doctor's HEALTHY branch (signature + probe) runs on a
      # lane that actually has an adapter, not only on the dev box
      - name: render + style + pack/export + cli suites (software Vulkan)
        env:
          SPRITEBOOK_REQUIRE_GPU: '1'
        run: deno test --allow-read --allow-write --allow-env --allow-ffi packages/render/ packages/style/ packages/pack/ packages/export/ packages/cli/
      - name: render throughput probe
        run: deno run --allow-read --allow-write --allow-env --allow-ffi packages/render/bench.ts .render-bench
      - name: upload throughput report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-throughput
          path: .render-bench/throughput.json
          if-no-files-found: warn
