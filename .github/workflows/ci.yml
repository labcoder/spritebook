name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm run check
      - run: npm run build:web -w spritebook-studio
      - name: commit lint (PR range)
        if: github.event_name == 'pull_request'
        run: node tools/ci/commit-lint.mjs --range origin/${{ github.base_ref }}..HEAD
      - name: tests required (PR)
        if: github.event_name == 'pull_request'
        run: node tools/ci/tests-required.ts --base origin/${{ github.base_ref }}
      - name: BOM guard (PR)
        if: github.event_name == 'pull_request'
        run: node tools/ci/bom-guard.ts --base origin/${{ github.base_ref }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - run: npm ci --ignore-scripts
      - name: prepare the weightless sidecar test environment
        run: uv sync --project sidecar --frozen
      - run: cargo test --locked --manifest-path packages/core/native/Cargo.toml
      - name: tests and coverage (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm run coverage
      - name: tests (macOS and Windows)
        if: matrix.os != 'ubuntu-latest'
        run: npm test
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage

  # Software rendering exercises structural assertions; it does not qualify native GPUs/desktop apps.
  lavapipe:
    runs-on: ubuntu-latest
    env:
      SPRITEBOOK_GPU_BACKEND: vulkan
      SPRITEBOOK_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.10'
      - name: install Mesa lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - name: confirm software adapter
        run: vulkaninfo --summary | grep -i llvmpipe
      - run: npm ci --ignore-scripts
      - run: uv sync --project sidecar --frozen
      - run: npm run build
      - name: render/style/pack/export/CLI structural and image checks
        run: node tools/test.mjs packages/render packages/style packages/pack packages/export packages/cli
      - name: throughput trend
        run: node packages/render/bench.ts .render-bench/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-throughput
          path: .render-bench/ci/throughput.json
          if-no-files-found: warn
