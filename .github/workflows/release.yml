# Candidate artifacts only until F7 clears native notices, signing and platform execution.
name: release candidates

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - name: tag matches the CLI version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(node --input-type=module -e "import { SPRITEBOOK_VERSION } from './packages/cli/version.ts'; console.log(SPRITEBOOK_VERSION)")
          test "v$version" = "$GITHUB_REF_NAME"
      - run: npm run build
      - run: cargo test --locked --manifest-path packages/core/native/Cargo.toml
      - run: npm run build:runtime
      - name: install software Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: execute the copied payload with an empty PATH
        run: node tools/runtime/check.mjs .build/runtime .render-bench/release-smoke
      - name: exercise Linux software rendering and all exporters
        if: runner.os == 'Linux'
        env:
          SPRITEBOOK_GPU_BACKEND: vulkan
        run: node tools/runtime/check.mjs .build/runtime .render-bench/release-gpu --gpu
      - name: archive the exact payload
        shell: bash
        run: tar -czf spritebook-${{ matrix.target }}.tar.gz -C .build/runtime .
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: |
            spritebook-*.tar.gz
            .render-bench/release-smoke/report.json
            .render-bench/release-gpu/report.json
          if-no-files-found: error

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --ignore-scripts
      - run: npm run build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-windows-installer
          path: apps/studio/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
