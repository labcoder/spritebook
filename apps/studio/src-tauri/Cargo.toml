[package]
name = "spritebook-studio"
version = "0.9.0"
edition = "2021"

[build-dependencies]
# D-005 rider: pin the Tauri minor
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
